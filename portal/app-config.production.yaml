app:
  title: Fossier Studio Portal
  # Should be the same as backend.baseUrl when using the `app-backend` plugin.
  baseUrl: ${PORTAL_BASE_URL}

organization:
  name: Fossier Studio

backend:
  # Note that the baseUrl should be the URL that the browser and other clients
  # should use when communicating with the backend, i.e. it needs to be
  # reachable not just from within the backend host, but from all of your
  # callers.
  baseUrl: ${PORTAL_BASE_URL}
  # Inside the container this binds all interfaces. The port is not published:
  # the tunnel container in deploy/docker-compose.yml is the only way in.
  listen: ':7007'
  csp:
    connect-src: ["'self'"]
  cors:
    origin: ${PORTAL_BASE_URL}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true

  # config options: https://node-postgres.com/apis/client
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

auth:
  environment: production
  providers:
    # Visitors go straight in as guests. This is safe only because
    # packages/backend/src/readOnlyPolicy.ts limits every user to reading public
    # content, and the backend has no plugins that can change anything.
    guest:
      dangerouslyAllowOutsideDevelopment: true

techdocs:
  builder: 'local'
  generator:
    # mkdocs is installed in the image, so no Docker socket is needed.
    runIn: 'local'
  publisher:
    type: 'local'
    local:
      publishDirectory: /app/techdocs

catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, Domain, Group, User]
  locations:
    # File locations are relative to the backend process, which is /app in the image.
    - type: file
      target: ./catalog/all.yaml

# Deploy history for the deploys plugin, exported from CI by
# scripts/export-deploys.mjs because the portal has no internet access.
deploys:
  dataDir: ./catalog/deploys
