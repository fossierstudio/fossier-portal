        },
        "/api/auth/push-token": {
          "put": {
            "summary": "Register or clear the device push token",
            "tags": ["Auth"],
            "requestBody": {
              "required": true,
              "content": {
                "application/json": {
                  "schema": {
                    "type": "object",
                    "properties": {
                      "token": {
                        "type": "string",
                        "nullable": true,
                        "maxLength": 512
                      }
                    }
                  }
                }
              }
            },
            "security": [
              {
                "bearerAuth": []
              }
            ],
            "responses": {
              "200": {
                "description": "Default Response"
              }
            }
          }
        },
        "/api/auth/verify-email": {
          "post": {
            "summary": "Verify email address with verification code",
            "tags": ["Auth"],
            "requestBody": {
              "required": true,
              "content": {
                "application/json": {
                  "schema": {
                    "type": "object",
                    "required": ["code"],
                    "properties": {
                      "code": {
                        "type": "string"
                      }
                    }
                  }
                }
              }
            },
            "responses": {
              "200": {
                "description": "Default Response"
              }
            }
          }
        },
        "/api/auth/resend-verification": {
          "post": {
            "summary": "Send email verification code",
            "tags": ["Auth"],
            "security": [
              {
                "bearerAuth": []
              }
            ],
            "responses": {
              "200": {
                "description": "Default Response"
              }
            }
          }
        },
        "/api/auth/forgot-password": {
          "post": {
            "summary": "Request password reset token",
            "tags": ["Auth"],
            "requestBody": {
              "required": true,
              "content": {
                "application/json": {
                  "schema": {
                    "type": "object",
                    "required": ["email"],
                    "properties": {
                      "email": {
                        "type": "string",
                        "format": "email"
                      }
                    }
                  }
                }
              }
            },
            "responses": {
              "200": {
                "description": "Default Response"
              }
            }
          }
        },
        "/api/auth/reset-password": {
          "post": {
            "summary": "Reset password using emailed code",
            "tags": ["Auth"],
            "requestBody": {
              "required": true,
              "content": {
                "application/json": {
                  "schema": {
                    "type": "object",
                    "required": ["code", "newPassword"],
                    "properties": {
                      "code": {
                        "type": "string"
                      },
                      "newPassword": {
                        "type": "string",
                        "minLength": 8,
                        "maxLength": 128
                      }
                    }
                  }
                }
              }
            },
            "responses": {
              "200": {
                "description": "Default Response"
              }
            }
          }
        },
        "/api/auth/restore-account": {
          "post": {
            "summary": "Cancel account deletion (within 30-day grace period)",
            "tags": ["Auth"],
            "security": [
              {
                "bearerAuth": []
              }
            ],
            "responses": {
              "200": {
                "description": "Default Response"
              }
            }
          }
        },
        "/api/auth/convert-guest": {
          "post": {
            "summary": "Convert a guest account to a full account",
            "tags": ["Auth"],
            "requestBody": {
              "required": true,
              "content": {
                "application/json": {
                  "schema": {
                    "type": "object",
                    "required": ["email", "password"],
                    "properties": {
                      "email": {
                        "type": "string",
                        "format": "email",
                        "maxLength": 255
                      },
                      "password": {
                        "type": "string",
                        "minLength": 8,
                        "maxLength": 128
                      },
                      "displayName": {
                        "type": "string",
                        "maxLength": 64
                      }
                    }
                  }
                }
              }
            },
            "security": [
              {
                "bearerAuth": []
              }
            ],
            "responses": {
              "200": {
                "description": "Default Response"
              }
            }
          }
        },
        "/api/auth/guest": {
          "delete": {
            "summary": "Delete a guest account (self-cleanup on leave)",
