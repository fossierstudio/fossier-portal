        {
          "name": "Roles"
        },
        {
          "name": "Search"
        },
        {
          "name": "Servers"
        },
        {
          "name": "Users"
        },
        {
          "name": "Voice"
        },
        {
          "name": "Voice Invites"
        },
        {
          "name": "Waitlist"
        },
        {
          "name": "Weather"
        }
      ],
      "paths": {
        "/api/health": {
          "get": {
            "responses": {
              "200": {
                "description": "Default Response"
              }
            },
            "tags": ["Health"]
          }
        },
        "/api/health/ready": {
          "get": {
            "responses": {
              "200": {
                "description": "Default Response"
              }
            },
            "tags": ["Health"]
          }
        },
        "/api/auth/register": {
          "post": {
            "summary": "Register a new account",
            "tags": ["Auth"],
            "requestBody": {
              "required": true,
              "content": {
                "application/json": {
                  "schema": {
                    "type": "object",
                    "required": ["username", "email", "password"],
                    "properties": {
                      "username": {
                        "type": "string",
                        "minLength": 2,
                        "maxLength": 32
                      },
                      "email": {
                        "type": "string",
                        "format": "email",
                        "maxLength": 255
                      },
                      "password": {
                        "type": "string",
                        "minLength": 8,
                        "maxLength": 128
                      },
                      "displayName": {
                        "type": "string",
                        "maxLength": 64
                      },
                      "inviteCode": {
                        "type": "string"
                      }
                    }
                  }
                }
              }
            },
            "responses": {
              "201": {
                "description": "Default Response",
                "content": {
                  "application/json": {
                    "schema": {
                      "type": "object",
                      "properties": {
                        "user": {
                          "type": "object",
                          "properties": {
                            "id": {
                              "type": "string"
                            },
                            "username": {
                              "type": "string"
                            },
                            "email": {
                              "type": "string",
                              "nullable": true
                            },
                            "displayName": {
                              "type": "string",
                              "nullable": true
                            },
                            "emailVerified": {
                              "type": "boolean"
                            },
                            "isGuest": {
                              "type": "boolean"
                            },
                            "guestInvitedBy": {
                              "type": "string",
                              "nullable": true
                            },
                            "isPlatformOwner": {
                              "type": "boolean"
                            }
                          }
                        },
                        "tokens": {
                          "type": "object",
                          "properties": {
                            "accessToken": {
                              "type": "string"
                            },
                            "refreshToken": {
                              "type": "string"
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "/api/auth/login": {
          "post": {
            "summary": "Login with username/email and password",
            "tags": ["Auth"],
            "requestBody": {
              "required": true,
              "content": {
                "application/json": {
                  "schema": {
                    "type": "object",
                    "required": ["identifier", "password"],
                    "properties": {
                      "identifier": {
                        "type": "string",
                        "description": "Username or email"
                      },
                      "password": {
                        "type": "string"
                      }
                    }
                  }
                }
              }
            },
            "responses": {
              "200": {
                "description": "Default Response",
                "content": {
                  "application/json": {
                    "schema": {
                      "type": "object",
                      "properties": {
                        "user": {
                          "type": "object",
                          "properties": {
                            "id": {
                              "type": "string"
                            },
                            "username": {
                              "type": "string"
                            },
                            "emailVerified": {
                              "type": "boolean"
                            },
                            "isGuest": {
                              "type": "boolean"
                            },
                            "isPlatformOwner": {
                              "type": "boolean"
                            }
                          }
                        },
                        "tokens": {
                          "type": "object",
                          "properties": {
                            "accessToken": {
                              "type": "string"
                            },
                            "refreshToken": {
                              "type": "string"
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "/api/auth/refresh": {
          "post": {
            "summary": "Refresh access token",
            "tags": ["Auth"],
            "requestBody": {
              "required": true,
              "content": {
                "application/json": {
                  "schema": {
                    "type": "object",
                    "required": ["refreshToken"],
                    "properties": {
                      "refreshToken": {
                        "type": "string"
                      }
                    }
                  }
                }
              }
            },
            "responses": {
              "200": {
                "description": "Default Response",
                "content": {
                  "application/json": {
                    "schema": {
                      "type": "object",
                      "properties": {
                        "accessToken": {
                          "type": "string"
                        },
                        "refreshToken": {
                          "type": "string"
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "/api/auth/logout": {
          "post": {
            "summary": "Logout (revoke refresh token)",
            "tags": ["Auth"],
            "requestBody": {
              "required": true,
              "content": {
                "application/json": {
                  "schema": {
                    "type": "object",
                    "required": ["refreshToken"],
                    "properties": {
                      "refreshToken": {
                        "type": "string"
                      }
                    }
                  }
                }
              }
            },
            "responses": {
              "204": {
                "description": "Default Response"
              }
            }
          }
        },
        "/api/auth/me": {
          "get": {
            "summary": "Get current user profile",
            "tags": ["Auth"],
            "security": [
              {
                "bearerAuth": []
              }
            ],
            "responses": {
              "200": {
                "description": "Default Response",
                "content": {
                  "application/json": {
                    "schema": {
                      "type": "object",
                      "properties": {
                        "id": {
                          "type": "string"
                        },
                        "username": {
                          "type": "string"
                        },
                        "email": {
                          "type": "string",
                          "nullable": true
                        },
                        "displayName": {
                          "type": "string",
                          "nullable": true
                        },
                        "avatarUrl": {
                          "type": "string",
                          "nullable": true
                        },
                        "bannerUrl": {
                          "type": "string",
                          "nullable": true
                        },
                        "status": {
                          "type": "string"
                        },
                        "emailVerified": {
                          "type": "boolean"
                        },
                        "isGuest": {
                          "type": "boolean"
                        },
                        "guestInvitedBy": {
                          "type": "string",
                          "nullable": true
                        },
                        "isPlatformOwner": {
                          "type": "boolean"
                        },
                        "lastDesktopLoginAt": {
                          "type": "string",
                          "nullable": true
                        },
                        "homeServerId": {
                          "type": "string",
                          "nullable": true
                        },
                        "bio": {
                          "type": "string",
                          "nullable": true
                        },
                        "pronouns": {
                          "type": "string",
                          "nullable": true
                        },
                        "statusText": {
                          "type": "string",
                          "nullable": true
                        },
                        "statusEmoji": {
                          "type": "string",
                          "nullable": true
                        },
                        "statusExpiresAt": {
                          "type": "string",
                          "nullable": true
                        },
                        "createdAt": {
                          "type": "string"
                        },
                        "updatedAt": {
                          "type": "string"
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "/api/auth/desktop-ping": {
          "post": {
            "summary": "Record desktop app activity for the current user",
            "tags": ["Auth"],
            "security": [
              {
                "bearerAuth": []
