        "/api/auth/me/privacy": {
          "get": {
            "summary": "Get current user privacy settings",
            "tags": ["Auth"],
            "security": [
              {
                "bearerAuth": []
              }
            ],
            "responses": {
              "200": {
                "description": "Default Response",
                "content": {
                  "application/json": {
                    "schema": {
                      "type": "object",
                      "properties": {
                        "showLastSeen": {
                          "type": "boolean"
                        },
                        "noiseSuppressionEnabled": {
                          "type": "boolean"
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "patch": {
            "summary": "Update current user privacy and voice settings",
            "tags": ["Auth"],
            "requestBody": {
              "required": true,
              "content": {
                "application/json": {
                  "schema": {
                    "type": "object",
                    "properties": {
                      "showLastSeen": {
                        "type": "boolean"
                      },
                      "noiseSuppressionEnabled": {
                        "type": "boolean"
                      }
                    }
                  }
                }
              }
            },
            "security": [
              {
                "bearerAuth": []
              }
            ],
            "responses": {
              "200": {
                "description": "Default Response",
                "content": {
                  "application/json": {
                    "schema": {
                      "type": "object",
                      "properties": {
                        "showLastSeen": {
                          "type": "boolean"
                        },
                        "noiseSuppressionEnabled": {
                          "type": "boolean"
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "/api/users/me": {
          "patch": {
            "responses": {
              "200": {
                "description": "Default Response"
              }
            },
