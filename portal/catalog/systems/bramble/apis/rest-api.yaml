apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: bramble-rest-api
  title: Bramble REST API
  description: Accounts, servers, channels, messages, DMs, roles, moderation, and search.
  tags:
    - rest
    - openapi
  annotations:
    backstage.io/source-location: url:https://github.com/fossierstudio/fossier-portal/tree/main/portal/catalog/systems/bramble/apis/
spec:
  type: openapi
  lifecycle: production
  owner: fossier-studio
  system: bramble
  definition: |
    {
      "openapi": "3.1.0",
      "info": {
        "title": "Bramble REST API",
        "version": "1.0.0",
        "description": "Client-facing REST API for Bramble, generated from the route schemas in the Bramble server. Admin and owner routes are left out. Real-time events go through the WebSocket gateway, which is its own API entity."
      },
      "servers": [
        {
          "url": "https://bramble.gg",
          "description": "Production"
        }
      ],
      "security": [
        {
          "bearerAuth": []
        }
      ],
      "tags": [
