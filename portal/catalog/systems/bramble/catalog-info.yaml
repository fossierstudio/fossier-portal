  name: bramble-redis
  title: Bramble Redis
  description: Presence and the event bus.
  annotations:
    backstage.io/source-location: url:https://github.com/fossierstudio/fossier-portal/tree/main/portal/catalog/systems/bramble/
spec:
  type: cache
  owner: fossier-studio
  system: bramble
